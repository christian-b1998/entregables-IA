<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Riwi Task Manager</title>
    <style>
        :root {
            --bg: #F4F5FA;
            --card: #fff;
            --tx: #171B49;
            --mut: #5b6080;
            --bd: #e3e5f0;
            --pr: #6857E8;
            --navy: #171B49;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme=light]) {
                --bg: #0f1230;
                --card: #1a1e4a;
                --tx: #eef0ff;
                --mut: #a9aed6;
                --bd: #2d3272;
                color-scheme: dark
            }
        }

        :root[data-theme=dark] {
            --bg: #0f1230;
            --card: #1a1e4a;
            --tx: #eef0ff;
            --mut: #a9aed6;
            --bd: #2d3272;
            color-scheme: dark
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
            color: inherit
        }

        button {
            cursor: pointer
        }

        h1,
        h2,
        h3,
        p {
            margin: 0
        }

        .btn {
            border: 1px solid var(--bd);
            background: var(--card);
            border-radius: 10px;
            padding: 8px 14px;
            min-height: 40px;
            font-weight: 600
        }

        .btn.p {
            background: var(--pr);
            border-color: var(--pr);
            color: #fff
        }

        .btn.d {
            color: #B91C1C;
            border-color: #B91C1C
        }

        .btn.s {
            min-height: 32px;
            padding: 3px 10px;
            font-size: 13px
        }

        .btn:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible,
        .tt:focus-visible,
        .ck:focus-visible {
            outline: 3px solid #a89cf5;
            outline-offset: 1px
        }

        .card {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 1px 3px rgba(23, 27, 73, .06)
        }

        .g {
            display: grid;
            gap: 14px
        }

        .g5 {
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr))
        }

        .g4 {
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr))
        }

        .g2 {
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr))
        }

        .mut {
            color: var(--mut);
            font-size: 13px
        }

        .row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap
        }

        .sp {
            flex: 1
        }

        .ls {
            display: inline-flex;
            border: 1px solid var(--bd);
            border-radius: 10px;
            overflow: hidden;
            background: var(--card)
        }

        .ls button {
            border: 0;
            background: none;
            padding: 6px 10px;
            min-height: 38px;
            font-weight: 600;
            font-size: 13px
        }

        .ls button[aria-pressed=true] {
            background: var(--pr);
            color: #fff
        }

        .logo {
            font-weight: 800;
            font-size: 22px;
            letter-spacing: -.5px
        }

        .logo b {
            color: var(--pr)
        }

        .app {
            display: flex;
            min-height: 100vh
        }

        .side {
            width: 244px;
            background: var(--navy);
            color: #fff;
            padding: 18px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: sticky;
            top: 0;
            height: 100vh;
            flex: none
        }

        .side .logo {
            padding: 6px 10px 16px
        }

        .side .logo b {
            color: #a89cf5
        }

        .nv {
            display: flex;
            gap: 10px;
            align-items: center;
            width: 100%;
            border: 0;
            background: none;
            color: #cfd2f5;
            padding: 10px 12px;
            border-radius: 10px;
            text-align: left;
            font-weight: 600;
            min-height: 44px
        }

        .nv:hover {
            background: rgba(255, 255, 255, .08)
        }

        .nv[aria-current=page] {
            background: var(--pr);
            color: #fff
        }

        .main {
            flex: 1;
            min-width: 0;
            padding: 20px 24px 80px
        }

        .hd {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 20px
        }

        .hd input {
            flex: 1;
            min-width: 140px;
            max-width: 320px
        }

        .mb {
            display: none
        }

        input,
        select,
        textarea {
            border: 1px solid var(--bd);
            background: var(--card);
            border-radius: 10px;
            padding: 8px 12px;
            min-height: 40px;
            width: 100%
        }

        .hd input {
            width: auto
        }

        .av {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: #fff;
            font-weight: 700;
            font-size: 13px;
            flex: none
        }

        .nb {
            background: #EF4444;
            color: #fff;
            border-radius: 99px;
            font-size: 11px;
            padding: 0 6px;
            margin-left: 4px
        }

        .sc {
            display: flex;
            gap: 12px;
            align-items: center
        }

        .ic {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-weight: 700;
            background: color-mix(in srgb, var(--c) 15%, transparent);
            color: var(--tx);
            border: 1px solid var(--c);
            flex: none
        }

        .sc b {
            font-size: 26px;
            line-height: 1
        }

        .pb {
            height: 8px;
            border-radius: 9px;
            background: var(--bd);
            overflow: hidden;
            margin-top: 8px
        }

        .pb i {
            display: block;
            height: 100%;
            background: var(--c);
            transition: width .4s
        }

        button.card {
            text-align: left;
            width: 100%
        }

        button.card:hover {
            border-color: var(--pr)
        }

        button.card[aria-pressed=true] {
            outline: 2px solid var(--pr)
        }

        .sec h2 {
            font-size: 17px;
            margin-bottom: 12px
        }

        .tk {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 12px;
            border: 1px solid var(--bd);
            border-radius: 12px;
            background: var(--card);
            margin-bottom: 8px;
            flex-wrap: wrap
        }

        .tk.dn .tt {
            text-decoration: line-through;
            color: var(--mut)
        }

        .tm {
            flex: 1;
            min-width: 200px
        }

        .ck {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            border: 2px solid var(--mut);
            background: none;
            font-weight: 800;
            color: #fff;
            flex: none
        }

        .dn .ck {
            background: #22C55E;
            border-color: #22C55E
        }

        .tt {
            border: 0;
            background: none;
            padding: 0;
            font-weight: 700;
            text-align: left;
            font-size: 15px
        }

        .ch {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 4px
        }

        .ch span {
            font-size: 12px;
            border: 1px solid var(--bd);
            border-radius: 99px;
            padding: 1px 9px;
            color: var(--mut)
        }

        .ch .cc {
            color: var(--tx);
            border-color: var(--c);
            background: color-mix(in srgb, var(--c) 12%, transparent)
        }

        .bdg {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            font-size: 12.5px;
            font-weight: 600;
            border: 1.5px solid var(--c);
            background: color-mix(in srgb, var(--c) 13%, transparent);
            border-radius: 99px;
            padding: 2px 10px;
            white-space: nowrap
        }

        .bdg b {
            color: var(--c);
            filter: brightness(.9)
        }

        .cards .tk {
            flex-direction: column;
            align-items: flex-start;
            margin: 0
        }

        .cards {
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr))
        }

        .tb {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 8px;
            margin-bottom: 14px
        }

        .emp {
            text-align: center;
            padding: 40px 16px;
            color: var(--mut)
        }

        .emp b {
            display: block;
            color: var(--tx);
            font-size: 17px;
            margin-bottom: 4px
        }

        .cal {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px
        }

        .cal .w {
            text-align: center;
            font-size: 12px;
            color: var(--mut);
            font-weight: 700;
            padding: 4px 0
        }

        .cd {
            min-height: 68px;
            border: 1px solid var(--bd);
            border-radius: 10px;
            background: var(--card);
            padding: 4px;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 3px;
            font-size: 13px
        }

        .cd.o {
            opacity: .45
        }

        .cd.t {
            border: 2px solid var(--pr)
        }

        .cd[aria-pressed=true] {
            background: color-mix(in srgb, var(--pr) 14%, var(--card))
        }

        .dots {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
            align-items: center
        }

        .dots i {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--c)
        }

        .dots em {
            font-size: 11px;
            font-style: normal;
            font-weight: 800
        }

        .cd.hv {
            box-shadow: inset 0 0 0 2px #F97316
        }

        .ov {
            position: fixed;
            inset: 0;
            background: rgba(10, 12, 40, .55);
            display: grid;
            place-items: center;
            padding: 12px;
            z-index: 50;
            overflow: auto
        }

        .md {
            width: 100%;
            max-width: 560px;
            max-height: 92vh;
            overflow: auto
        }

        .md label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin: 10px 0 3px
        }

        .er {
            color: #B91C1C;
            font-size: 12.5px;
            display: block
        }

        .fm {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 12px
        }

        .fm .f {
            grid-column: 1/-1
        }

        #toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--navy);
            color: #fff;
            padding: 10px 18px;
            border-radius: 12px;
            z-index: 80;
            font-weight: 600;
            max-width: 90vw
        }

        .don {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            flex: none
        }

        .don div {
            width: 104px;
            height: 104px;
            border-radius: 50%;
            background: var(--card);
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 26px
        }

        .bars {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            height: 140px
        }

        .bars div {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100%;
            font-size: 12px
        }

        .bars i {
            width: 100%;
            background: var(--pr);
            border-radius: 6px 6px 0 0;
            min-height: 3px
        }

        .hero {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
            align-items: center;
            padding: 40px 0
        }

        .hero h1 {
            font-size: clamp(30px, 5vw, 50px);
            line-height: 1.1;
            letter-spacing: -1px
        }

        .wrap {
            max-width: 1080px;
            margin: 0 auto;
            padding: 16px 20px
        }

        .stu {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 12px;
            border: 2px solid var(--bd);
            border-radius: 14px;
            background: var(--card);
            width: 100%;
            margin-bottom: 10px;
            text-align: left
        }

        .stu[aria-pressed=true] {
            border-color: var(--pr)
        }

        @media(max-width:860px) {
            .side {
                position: fixed;
                left: 0;
                top: 0;
                z-index: 40;
                transform: translateX(-100%);
                transition: transform .25s
            }

            .side.open {
                transform: none
            }

            .mb {
                display: inline-flex
            }

            .main {
                padding: 14px 12px 80px
            }

            .hero {
                grid-template-columns: 1fr
            }

            .qa {
                display: none
            }

            .fm {
                grid-template-columns: 1fr
            }

            .cd {
                min-height: 52px
            }

            .btn {
                min-height: 44px
            }
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                transition: none !important
            }
        }
    </style>
</head>

<main class="main"><header class="hd"><button class="btn s mb" data-a="menu" aria-label="${t('menu')}">☰</button><div class="sp" style="min-width:160px"><h1 style="font-size:22px">${t('hi', { n: u.name.split(' ')[0] })} 👋</h1><p class="mut" style="text-transform:capitalize">${fmt(add(0), { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</p></div><input id="hq" type="search" data-f="q" placeholder="${t('search')}" aria-label="${t('search')}" value="${E(S.f.q)}"><button class="btn" data-a="bell" aria-label="${t('rem')}">🔔${n ? `<span class="nb">${n}</span>` : ''}</button>${LS()}<button class="btn p" data-a="add">＋ <span class="qa">${t('quick')}</span></button><span class="av" style="background:${u.col}" aria-hidden="true">${u.ini}</span></header><h2 style="margin-bottom:14px;font-size:20px">${t('nav.' + S.page)}</h2>${pg}</main></div>`
        }
        function landing() {
            const fe = [['f1', '◧'], ['f2', '⏰'], ['f3', '↗'], ['f4', '▦'], ['f5', '＋']];
            return `<div class="wrap"><header class="row">${logo}<span class="sp"></span><a href="#features" class="btn" style="text-decoration:none;color:inherit">${t('feat')}</a>${LS()}<button class="btn p" data-a="start">${t('start')}</button></header>
<section class="hero"><div><p class="mut" style="font-weight:700;color:var(--pr)">${t('tag')}</p><h1 style="margin:10px 0">${t('h1')}</h1><p class="mut" style="font-size:17px;margin-bottom:20px">${t('h2')}</p><button class="btn p" data-a="start" style="font-size:16px;padding:12px 24px">${t('start')} →</button></div>
<div class="card" aria-hidden="true"><div class="row"><b>${t('focus')}</b></div>${[['dev', 'Build REST API', 3], ['eng', 'Speaking practice', 1], ['soc', 'Peer feedback', 0]].map(([c, n, d]) => `<div class="tk"><span class="ic" style="--c:${CAT[c].c}">${CAT[c].i}</span><b class="tm" style="min-width:90px">${n}</b>${badge({ st: 'pending', due: add(d) })}</div>`).join('')}<div class="pb" style="--c:#6857E8"><i style="width:64%"></i></div></div></section>
<section id="features" class="sec"><h2 style="font-size:26px;text-align:center;margin-bottom:18px">${t('ftit')}</h2><div class="g g4">${fe.map(([k, i]) => `<div class="card"><span class="ic" style="--c:#6857E8">${i}</span><h3 style="margin:10px 0 4px">${t(k)}</h3><p class="mut">${t(k + 'd')}</p></div>`).join('')}</div></section>
<section class="card" style="margin:36px 0;text-align:center;background:var(--navy);color:#fff"><h2 style="font-size:24px;margin-bottom:12px">${t('cta')}</h2><button class="btn p" data-a="start">${t('start')} →</button></section><p class="mut" style="text-align:center">${t('proto')}</p></div>`
        }
        function login() { return `<div class="wrap" style="max-width:480px"><header class="row">${logo}<span class="sp"></span>${LS()}</header><div class="card" style="margin-top:30px"><h1 style="font-size:26px">${t('wel')} 👋</h1><p class="mut" style="margin:6px 0 16px">${t('pick')}</p>${STU.map(s => { const l = SEED[s.id], d = l.filter(r => r[4] == 'd').length; return `<button class="stu" data-a="pick" data-v="${s.id}" aria-pressed="${S.pick == s.id}"><span class="av" style="background:${s.col}">${s.ini}</span><span><b>${s.name}</b><br><span class="mut">${l.length} · ✓ ${d}</span></span></button>` }).join('')}<button class="btn p" data-a="login" style="width:100%;margin-top:6px">${t('enter')}</button><p class="mut" style="margin-top:12px">${t('proto')}</p><button class="btn s" data-a="home" style="margin-top:8px">← ${t('back')}</button></div></div>` }
        function render() {
            const r = document.documentElement; r.lang = S.lang; S.theme == 'auto' ? r.removeAttribute('data-theme') : r.dataset.theme = S.theme; document.title = 'Riwi Task Manager';
            $('#app').innerHTML = S.route == 'landing' ? landing() : S.route == 'login' ? login() : appv()
        }
        function toast(k) { const e = document.createElement('div'); e.id = 'toast'; e.setAttribute('role', 'status'); e.textContent = t(k); document.body.append(e); setTimeout(() => e.remove(), 2400) }
        const closeM = () => { $('#m').innerHTML = '' };
        const modal = h => { $('#m').innerHTML = `<div class="ov" data-a="bg"><div class="card md" role="dialog" aria-modal="true">${h}</div></div>`; const f = $('#m input,#m button'); f && f.focus() };
        function form(x) {
            x = x || {}; const v = (k, d) => E(x[k] ?? d ?? '');
            return `<h2 style="margin-bottom:6px">${x.id ? t('editT') : t('addT')}</h2><form id="tf" novalidate class="fm"><input type="hidden" name="id" value="${v('id')}"><div class="f"><label for="f1">${t('ttl')} *</label><input id="f1" name="title" value="${v('title')}" maxlength="90"><small class="er" data-e="title"></small></div>
<div><label for="f2">${t('fcat')} *</label><select id="f2" name="cat">${opts(Object.keys(CAT), 'c.', x.cat || 'dev')}</select></div><div><label for="f3">${t('fdl')} *</label><input id="f3" type="date" name="due" value="${v('due', add(1))}"><small class="er" data-e="due"></small></div>
<div><label for="f4">${t('fty')}</label><select id="f4" name="ty">${opts(TYPES, 'ty.', x.ty, t('none'))}</select></div><div><label for="f5">${t('fpr')}</label><select id="f5" name="pr">${opts(PRS, 'pr.', x.pr || 'med')}</select></div>
<div><label for="f6">${t('fsrc')}</label><select id="f6" name="src">${opts(SRCS, 'src.', x.src || 'personal')}</select></div><div><label for="f7">${t('fst')}</label><select id="f7" name="st">${opts(['pending', 'progress', 'done'], 'st.', x.st || 'pending')}</select></div>
<div class="f"><label for="f8">${t('desc')}</label><textarea id="f8" name="desc" rows="2">${v('desc')}</textarea></div><div class="f"><label for="f9">${t('fnotes')}</label><textarea id="f9" name="notes" rows="2">${v('notes')}</textarea></div><div class="f"><label for="f10">${t('url')}</label><input id="f10" name="url" type="url" value="${v('url')}" placeholder="https://"></div>
<div class="f row" style="justify-content:flex-end;margin-top:14px"><button type="button" class="btn" data-a="close">${t('cancel')}</button><button class="btn p">${t('save')}</button></div></form>`
        }
        function detail(x) {
            const c = CAT[x.cat], s = st(x), r = (l, v) => `<p style="margin:6px 0"><span class="mut">${l}:</span> ${v || '—'}</p>`;
            return `<div class="row"><span class="ic" style="--c:${c.c}" aria-hidden="true">${c.i}</span><h2 class="sp">${E(x.title)}</h2></div><div style="margin:10px 0">${badge(x)}</div>${r(t('fcat'), t('c.' + x.cat))}${r(t('fty'), x.ty && t('ty.' + x.ty))}${r(t('fdl'), fmt(x.due, SD) + ' (' + fmt(x.due, { weekday: 'long' }) + ')')}${r(t('fpr'), t('pr.' + x.pr))}${r(t('fsrc'), t('src.' + x.src))}${r(t('created'), fmt(x.created, SD))}${r(t('desc'), E(x.desc))}${r(t('fnotes'), E(x.notes))}${x.url && /^https?:/.test(x.url) ? `<p><a href="${E(x.url)}" target="_blank" rel="noopener noreferrer">${t('open')} ↗</a></p>` : ''}
<label class="mut" for="ds" style="display:block;margin-top:10px">${t('fst')}</label><select id="ds" data-sid="${x.id}">${opts(['pending', 'progress', 'done'], 'st.', x.st)}</select><div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" data-a="edit" data-id="${x.id}">✎ ${t('edit')}</button><button class="btn d" data-a="del" data-id="${x.id}">${t('del')}</button><button class="btn" data-a="close">${t('close')}</button></div>`
        }
        const get = id => S.tasks.find(x => x.id == id);
        function setSt(x, v) { const was = x.st; x.st = v; x.doneAt = v == 'done' ? (x.doneAt || add(0)) : null; if (v == 'done' && was != 'done') log('completed', x.title); else if (was == 'done' && v != 'done') log('reopened', x.title); else log('updated', x.title) }
        const A = {
            lang(_, v) { S.lang = v; saveP(); closeM(); render() }, start() { S.route = S.user ? 'app' : 'login'; render() }, home() { S.route = 'landing'; render() }, pick(_, v) { S.pick = v; render() },
            login() { load(S.pick); S.route = 'app'; S.page = 'dash'; render() }, out() { S.route = 'login'; S.menu = false; render() }, go(_, v) { S.page = v; S.menu = false; render(); scrollTo(0, 0) }, menu() { S.menu = !S.menu; render() },
            swu(_, v) { load(v); toast('ok'); render() }, close: closeM, bg(_, v, b) { },
            tog(id) { const x = get(id); setSt(x, x.st == 'done' ? 'pending' : 'done'); saveT(); toast(x.st == 'done' ? 'ok.done' : 'ok.re'); render() },
            view(id) { modal(detail(get(id))) }, edit(id) { modal(form(get(id))) }, add() { modal(form()) },
            del(id) { const x = get(id); modal(`<h2>${t('del')}</h2><p style="margin:10px 0 16px">${t('delQ')}<br><b>${E(x.title)}</b></p><div class="row" style="justify-content:flex-end"><button class="btn" data-a="close">${t('cancel')}</button><button class="btn d" data-a="delok" data-id="${id}">${t('del')}</button></div>`) },
            delok(id) { const x = get(id); log('deleted', x.title); S.tasks = S.tasks.filter(y => y.id != id); saveT(); closeM(); toast('ok.d'); render() },
            catf(_, v) { S.f = { q: '', cat: v, st: '', pr: '', ty: '', src: '', dl: '', sort: 'asc' }; S.page = 'tasks'; render() }, ccat(_, v) { S.csel = v; render() }, clr() { S.f = { q: '', cat: '', st: '', pr: '', ty: '', src: '', dl: '', sort: S.f.sort }; render() },
            vw(_, v) { S.P.view = v; saveP(); render() }, day(_, v) { S.sel = v; render() },
            cn(_, v) { v = +v; if (!v) { const d = new Date(); S.cm = { y: d.getFullYear(), m: d.getMonth() }; S.sel = add(0) } else { const d = new Date(S.cm.y, S.cm.m + v, 1); S.cm = { y: d.getFullYear(), m: d.getMonth() } } render() },
            bell() { const l = urgent().sort((a, b) => diff(a) - diff(b)); modal(`<h2 style="margin-bottom:10px">🔔 ${t('rem')}</h2>${l.length ? l.map(row).join('') : `<div class="emp">${t('caught')}</div>`}<div class="row" style="justify-content:flex-end"><button class="btn" data-a="close">${t('close')}</button></div>`) }
        };
        document.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (!b) return; if (b.dataset.a == 'bg' && e.target !== b) return; if (b.dataset.a == 'bg') return closeM(); const f = A[b.dataset.a]; if (f) { if (['tog', 'view', 'edit', 'del', 'delok'].includes(b.dataset.a) && $('#m .ov') && b.dataset.a != 'delok' && b.dataset.a != 'tog') closeM(); f(b.dataset.id, b.dataset.v, b); if (['tog'].includes(b.dataset.a) && $('#m .ov')) { closeM(); } } });
        document.addEventListener('input', e => { if (e.target.dataset.f != 'q') return; S.f.q = e.target.value; if (S.page != 'tasks') { S.page = 'tasks'; render(); const h = $('#hq'); h.focus(); h.setSelectionRange(99, 99) } else $('#tl').innerHTML = tlist(flt()) });
        document.addEventListener('change', e => { const el = e.target; if (el.dataset.f) { S.f[el.dataset.f] = el.value; render() } else if (el.dataset.p) { const k = el.dataset.p, v = el.type == 'checkbox' ? el.checked : el.value; k == 'theme' ? S.theme = v : S.P[k] = v; saveP(); render() } else if (el.dataset.sid) { const x = get(el.dataset.sid); setSt(x, el.value); saveT(); toast('ok.s'); render() } });
        document.addEventListener('submit', e => {
            e.preventDefault(); const f = e.target, d = Object.fromEntries(new FormData(f)), er = {}; if (d.title.trim().length < 3) er.title = t('eT'); if (!d.due) er.due = t('eD');
            f.querySelectorAll('[data-e]').forEach(s => s.textContent = er[s.dataset.e] || ''); const ks = Object.keys(er); if (ks.length) { f.elements[ks[0]].setAttribute('aria-invalid', 'true'); return f.elements[ks[0]].focus() }
            if (d.id) { const x = get(d.id), od = x.due; Object.assign(x, { title: d.title.trim(), desc: d.desc, notes: d.notes, url: d.url, cat: d.cat, ty: d.ty, due: d.due, pr: d.pr, src: d.src }); setSt(x, d.st); if (od != d.due) log('deadline', x.title); toast('ok.s') }
            else { const x = { id: 'n' + Date.now(), title: d.title.trim(), desc: d.desc, notes: d.notes, url: d.url, cat: d.cat, ty: d.ty, due: d.due, pr: d.pr, src: d.src, st: d.st, created: add(0), doneAt: d.st == 'done' ? add(0) : null }; S.tasks.push(x); log('created', x.title); toast('ok.c') }
            saveT(); closeM(); render()
        });
        document.addEventListener('keydown', e => { if (e.key == 'Escape') closeM() });
        if (S.user) load(S.user); render();
    </script>
</body>
